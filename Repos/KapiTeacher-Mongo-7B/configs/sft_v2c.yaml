# sft_v2c.yaml - SFT QLoRA do KapiTeacher-Mongo-7B (Qwen2.5-Coder-7B Base) sobre o corpus v2c.
# Fontes: docs/fase-02-professor.md §3.3 (estagio B), docs/fase-05-treinamento.md §6.2 (hiperparametros 7B), §4.2-§4.3, §9.6;
# reports/teacher_choice.json (7B: 360 tok/s a 4k r=64, 8,2 GB), reports/probe/attention_t4.md (SDPA/AOTriton).
# Uso: python -I scripts/teacher/train_teacher.py --config Repos/KapiTeacher-Mongo-7B/configs/sft_v2c.yaml --resume auto
version: sft-v2c/1
run:
  name: sft_v2c
  seed: 20261008
  stage: sft              # CPT (estagio A) NAO esta neste job: ver README_job.md (decisao do usuario)

model:
  path: BaseRepos/Qwen2.5-Coder-7B     # revisao fixada em BaseRepos/base-repos.lock.json (0396a761...)
  quant: nf4                           # NF4 double-quant, compute bf16; embed e lm_head em bf16
  attn: sdpa                           # AOTriton (TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1, definido por configure_caches): flash causal

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  corpus_dir: data/teacher/v2c         # build_teacher_corpus.py; train-*.npz em ordem do manifest (ja aleatoria)
  micro_tokens: 4096                   # linha = micro-batch de <= 4096 tokens padded (tem de ser o do corpus)
  max_train_tokens: null               # tokens reais a consumir (null = corpus inteiro); e o botao de corte (README_job.md §6)

optim:
  name: paged_adamw_8bit               # bitsandbytes 0.50.2
  lr: 1.0e-4
  min_lr_ratio: 0.1                    # cosseno ate 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.03
  grad_clip: 1.0
  tokens_per_step: 49152               # 12 linhas x 4096 (Fase 05 §6.2: ~49k tokens efetivos/passo no 7B)

loss:
  ce_chunk: 1024                       # CE em blocos, so nas posicoes do alvo (logit 4k x 152k nao cabe)

memory:
  max_vram_fraction: 0.94              # teto ~14,8 GB (Fase 05 §4.2); excesso vira OOM explicito, nunca paginacao
  vram_reserve_gb: 1.6
  gradient_checkpointing: true

checkpoint:
  dir: Repos/KapiTeacher-Mongo-7B/checkpoints   # <dir>/<run.name>/step-XXXXXX (atomico: .tmp -> rename + COMPLETE)
  every_minutes: 30
  every_pct_steps: 5
  every_steps: null
  keep: 3                              # + best (menor val_loss) + final

eval:
  every_pct_steps: 10
  every_steps: null
  val_loss: true                       # val_loss.npz (600 FIM + 200 chat do split val)
  gen_examples: 100                    # FIM greedy no val (max 96 tokens): exact match / normalized / syntax / mongo_valid
  final_gen_examples: 200
  max_new_tokens: 96

budget:
  hours: 34                            # tempo de treino acumulado (entre retomadas); ao estourar: checkpoint + final + exit 0

paths:
  reports_dir: Repos/KapiTeacher-Mongo-7B/reports     # <dir>/<run.name>/{metrics.jsonl,run_manifest.json,eval_history.jsonl}
  adapters_dir: Repos/KapiTeacher-Mongo-7B/adapters   # <dir>/<run.name>/final
  gates: configs/gates.yaml
  contract_golden: data/contracts/editor-context-v1.golden
