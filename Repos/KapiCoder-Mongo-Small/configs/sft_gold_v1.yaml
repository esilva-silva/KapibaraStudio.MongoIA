# sft_gold_v1.yaml - aluno T1 Small - CONTROLE sem professor (J10; rotulo gold)
# J10: MESMOS prompts/ids/ordem/hiperparametros do braco distilado, rotulo gold (referencia do G2.4: professor >= melhor aluno sem professor + 5 p.p.).
# Script: scripts/student/train_student.py (estende scripts/teacher/train_teacher.py). Corpus: scripts/student/build_student_corpus.py -> data/student/gold/t1.
# O braco distill usa o MESMO arquivo salvo run.name/run.arm/data.corpus_dir (hiperparametros identicos: so o rotulo muda). Gates: configs/gates.yaml (T1).
# Uso: python -I scripts/student/train_student.py --config Repos/KapiCoder-Mongo-Small/configs/sft_gold_v1.yaml --resume auto   (ou pela fila: configs/gpu_queue.yaml)
version: sft-student/1
run:
  name: sft_gold_v1
  arm: gold                       # distill = alvo do professor (fim_ctx/completion) | gold = middle original (controle J10)
  tier: t1
  seed: 20261018
  stage: sft

model:
  path: BaseRepos/Qwen2.5-Coder-1.5B   # revisao fixada em BaseRepos/base-repos.lock.json
  method: lora                    # full | lora (decisao e medidas: Repos/KapiCoder-Mongo-Small/README_job.md §2)
  master_dtype: bf16                  # full: pesos mestre fp32 + autocast bf16 (bf16 puro perde as atualizacoes pequenas de LR 2e-5)
  attn: sdpa                        # AOTriton (TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1 via configure_caches); linhas sem mascara, atencao causal

lora:                               # so com method: lora
  r: 64
  alpha: 128
  dropout: 0.05
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  corpus_dir: data/student/gold/t1
  micro_tokens: 16384               # linha = micro-batch de <= 16.384 tokens padded (tem de ser o do corpus)
  epochs: 2                         # Fase 05 §6.2: 2 epocas (a epoca 2 reembaralha as linhas, seed fixa)
  max_train_tokens: null            # corte do job: tokens reais por epoca (null = corpus inteiro)

optim:
  name: adamw                   # adamw (torch, fused) | adamw8bit | paged_adamw8bit (bitsandbytes)
  lr: 1.5e-4                       # LoRA r=64 alpha=128 (Fase 05 §6.2, linha v1)
  min_lr_ratio: 0.1                 # cosseno ate 10% do pico
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.03
  grad_clip: 1.0
  tokens_per_step: 32768            # 2 linhas de 16.384 (Fase 05 §6.2: 32.768 tokens/passo efetivos)

loss:
  ce_chunk: 1024                    # CE em blocos, so nas posicoes do alvo

memory:
  max_vram_fraction: 0.94           # teto ~14,8 GB (Fase 05 §4.2); excesso vira OOM explicito, nunca paginacao
  vram_reserve_gb: 1.6
  gradient_checkpointing: true

checkpoint:
  dir: Repos/KapiCoder-Mongo-Small/checkpoints   # <dir>/<run.name>/step-XXXXXX (atomico: .tmp -> rename + COMPLETE)
  every_minutes: 30
  every_pct_steps: 5
  every_steps: null
  keep: 2                           # + adapters/<run>/{best,final} (lora) e merged/<run> (modelo bf16 completo, gitignored)

eval:
  every_pct_steps: 10
  every_steps: null
  val_loss: true                    # val_loss.npz (600 FIM do val v2c + 100 monitor Generic-JS), igual ao do professor
  gen_examples: 100                 # FIM greedy no val (max 96 tokens): EM / normalized / syntax / mongo_valid estatico
  final_gen_examples: 200
  generic_gen_examples: 50          # monitor Generic-JS (val_gen_generic.jsonl)
  final_generic_gen_examples: 100
  max_new_tokens: 96

budget:
  hours: 22                   # tempo de treino acumulado (entre retomadas); ao estourar: checkpoint + final + exit 0

paths:
  reports_dir: Repos/KapiCoder-Mongo-Small/reports     # <dir>/<run.name>/{metrics.jsonl,eval_history.jsonl,run_manifest.json,heartbeat.json}
  adapters_dir: Repos/KapiCoder-Mongo-Small/adapters   # lora: <dir>/<run.name>/{best,final}
  merged_dir: Repos/KapiCoder-Mongo-Small/merged       # modelo completo bf16 (full ou lora mesclado): <dir>/<run.name>
  gates: configs/gates.yaml
  contract_golden: data/contracts/editor-context-v1.golden
