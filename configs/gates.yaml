# gates.yaml - gates de aprovacao por tier (KapiCoder-Mongo v2)
# Fonte: docs/fase-06-avaliacao-benchmarks.md §8 (linhas ~207-304) e §7 (estatistica, ~195-205).
# Rascunho: commitar ANTES do primeiro treino (hash no manifest da Fase 05).
# Convencoes:
#   op: >=, <=, ==, noninferior (limite inferior do IC95% do delta > -margin), superior (p<0,05 ou IC95% do delta > 0)
#   threshold_is_delta: true  => threshold e relativo ao `baseline` (ex.: base + 3 pp)
#   hypothesis: true => marcado [hipotese]/[proposta]/"a medir" no proprio item ou na tabela (todo §8 e [proposta] no nivel da secao)
#   blocking: true => falha reprova o tier/modo; false => falha aciona o `fallback` ou so e reportada
#   todo: true + threshold: null => a doc nao da numero
#   group/group_mode: gates alternativos ("ou"): group_mode any = basta um passar; all = todos
#   owner: python (check_gates.py) | kapilab (so o que depende do codigo da IDE; kapilab-console.md §5 "Donos dos gates")
version: 1
status: draft
source: "docs/fase-06-avaliacao-benchmarks.md#8"
precedence: "Fase 06 prevalece sobre Fase 04 §10.2 e Fase 07 §7.2–7.5"
baselines:
  base_v1_0.5b: "modelo v1 0.5B re-medido na suite v2 (Fase 06 §8, abertura)"
  base_v1_1.5b: "modelo v1 1.5B re-medido na suite v2"

# --- Estatistica (Fase 06 §7) ---
statistics:
  binary_metric_test: {test: mcnemar_exact, report: [better, worse, equal, p_two_sided], note: "teste do sinal nos pares discordantes (como na v1)"}
  continuous_metric_test: {test: paired_bootstrap, resamples: 10000, ci: 0.95, also_by_group: true}
  multiple_testing: {method: holm_bonferroni, applies_to: superiority, note: "nao-inferioridade nao e corrigida (conservadora)"}
  superiority: {rule: "p < 0,05 (McNemar) ou IC95% do delta inteiramente > 0", alpha: 0.05}
  noninferiority: {rule: "limite inferior do IC95% do delta > -margem"}
  latency: {estimator: p95_bootstrap, sessions: 3, note: "3 sessoes em dias diferentes para T3 (variacao termica)"}
  same_examples: true   # compare_models.py recalcula nos MESMOS exemplos (licao v1)
  margins: {T0_apt_vs_base_v1_0.5b: 0.05, T1_apt_vs_T0: 0.10, T4_lite_thinking_vs_off_pp: 2}

tiers:
  # ---------------------------------------------------------------- T0 Nano ~0,5B (§8 T0)
  T0:
    name: "Nano (~0,5B) - autocomplete"
    gates:
      - {id: T0.apt_vs_base, metric: apt_vs_base_v1_0.5b, op: noninferior, threshold: null, margin: 0.05, owner: python, blocking: true, baseline: base_v1_0.5b, hypothesis: false, source_note: "§8 T0: nao-inferior margem 0,05 (mesmos exemplos); parte '>= +0,15' em T0.apt_gain", group: T0.apt_vs_base_all, group_mode: all}
      - {id: T0.apt_gain, metric: apt_vs_base_v1_0.5b_mean_delta, op: ">=", threshold: 0.15, threshold_is_delta: true, unit: apt, owner: python, blocking: true, baseline: base_v1_0.5b, hypothesis: false, source_note: "§8 T0: >= +0,15 em media (v1: 3,57)", group: T0.apt_vs_base_all, group_mode: all}
      - {id: T0.apt_per_group, metric: apt_delta_per_group_min, op: ">=", threshold: -0.15, unit: apt, owner: python, blocking: true, baseline: base_v1_0.5b, tier_condition: "grupos com n >= 50", hypothesis: false, source_note: "§8 T0: nenhum grupo com delta < -0,15 (regra v1)"}
      - {id: T0.syntax_valid, metric: syntax_valid, op: ">=", threshold: 0.92, unit: ratio, owner: python, blocking: true, hypothesis: false, source_note: "§8 T0 (v1: 0,907)"}
      - {id: T0.mongodb_valid, metric: mongodb_valid, op: ">=", threshold: 0.92, unit: ratio, owner: python, blocking: true, hypothesis: false, source_note: "§8 T0 (v1: 0,906)"}
      - {id: T0.exec_match_autocomplete, metric: exec_match_autocomplete, op: ">=", threshold: 3, threshold_is_delta: true, unit: pp, owner: python, blocking: true, baseline: base_v1_0.5b, hypothesis: false, source_note: "§8 T0: >= base_v1_0.5b + 3 pp"}
      - {id: T0.nonexistent_fields, metric: nonexistent_fields_rate, op: "<=", threshold: 3, unit: pct, owner: python, blocking: true, hypothesis: false, source_note: "§8 T0: <= 3% das sugestoes"}
      - {id: T0.conversational_suggestion, metric: conversational_suggestion_rate, op: "==", threshold: 0, unit: pct, owner: python, blocking: true, hypothesis: false, source_note: "§8 T0: 0%"}
      # Pacote CPU INT4/INT8, harness da IDE, Ryzen 9 7900 (tabela §8 T0, linha "Pacote CPU")
      - {id: T0.cpu.ttft_mean_ms, metric: ttft_autocomplete_mean, op: "<=", threshold: 150, unit: ms, owner: kapilab, blocking: true, tier_condition: "CPU INT4/INT8, Ryzen 9 7900, harness IDE", hypothesis: false, source_note: "§8 T0"}
      - {id: T0.cpu.ttft_p95_ms, metric: ttft_autocomplete_p95, op: "<=", threshold: 250, unit: ms, owner: kapilab, blocking: true, tier_condition: "CPU INT4/INT8, Ryzen 9 7900, harness IDE", hypothesis: false, source_note: "§8 T0"}
      - {id: T0.cpu.ram_peak_gb, metric: ram_peak, op: "<=", threshold: 1.8, unit: GB, owner: kapilab, blocking: true, tier_condition: "CPU INT4/INT8, Ryzen 9 7900", hypothesis: false, source_note: "§8 T0 (alvo < 2 GB; v1 1,5 GB)"}
      - {id: T0.cpu.disk_mb, metric: package_disk_size, op: "<=", threshold: 700, unit: MB, owner: kapilab, blocking: true, hypothesis: false, source_note: "§8 T0"}
      - {id: T0.cpu_modest.ttft_p95_ms, metric: ttft_p95, op: "<=", threshold: 400, unit: ms, owner: kapilab, blocking: true, tier_condition: "CPU modesta (notebook 4 nucleos/8 GB, a definir; Fase 06 §5.2)", hypothesis: false, source_note: "§8 T0"}
      # Paridade: ver common.parity (§6)

  # ---------------------------------------------------------------- T1 Small ~1,5B (§8 T1)
  T1:
    name: "Small (~1,5B) - autocomplete + chat"
    gates:
      - {id: T1.chat_free_gain, metric: chat_free_v2_vs_base_v1_1.5b, op: ">=", threshold: 6, threshold_is_delta: true, unit: pp, owner: python, blocking: true, baseline: base_v1_1.5b, tier_condition: "chat livre escrito a mao v2, n >= 120", hypothesis: false, source_note: "§8 T1: >= base + 6 pp", group: T1.chat_free_all, group_mode: all}
      - {id: T1.chat_free_mcnemar, metric: chat_free_v2_vs_base_v1_1.5b_mcnemar_p, op: superior, threshold: 0.05, unit: p, owner: python, blocking: true, baseline: base_v1_1.5b, hypothesis: false, source_note: "§8 T1: McNemar p < 0,05 (Holm com demais superioridades, §7)", group: T1.chat_free_all, group_mode: all}
      - {id: T1.chat_free_abs, metric: chat_free_v2_accuracy, op: ">=", threshold: 80, unit: pct, owner: python, blocking: true, hypothesis: false, source_note: "§8 T1 (v1: 87/120 = 72,5%)", group: T1.chat_free_all, group_mode: all}
      - {id: T1.blind_v2_abs, metric: blind_v2_accuracy, op: ">=", threshold: 80, unit: pct, owner: python, blocking: true, tier_condition: "cego v2 n >= 40 (meta 80)", hypothesis: false, source_note: "§8 T1 (v1: 29/40 = 72,5%)"}
      - {id: T1.blind_v2_vs_base, metric: blind_v2_vs_base_v1_1.5b, op: noninferior, threshold: null, margin: null, owner: python, blocking: true, baseline: base_v1_1.5b, hypothesis: false, todo: true, source_note: "§8 T1: 'nao pior que base_v1_1.5b (McNemar)'; margem nao numerica na doc"}
      - {id: T1.legacy_v1_120, metric: legacy_v1_correct, op: ">=", threshold: 87, unit: of_120, owner: python, blocking: true, hypothesis: false, source_note: "§8 T1: >= 87/120"}
      - {id: T1.exec_match_chat, metric: exec_match_chat, op: ">=", threshold: 85, unit: pct, owner: python, blocking: true, hypothesis: false, source_note: "§8 T1"}
      - {id: T1.apt_vs_t0, metric: apt_vs_T0_approved, op: noninferior, threshold: null, margin: 0.10, owner: python, blocking: true, baseline: "T0 aprovado", hypothesis: false, source_note: "§8 T1: nao-inferior margem 0,10 (o mesmo modelo serve autocomplete)"}
      - {id: T1.ptbr_en_gap, metric: ptbr_vs_en_gap, op: "<=", threshold: 8, unit: pp, owner: python, blocking: true, hypothesis: false, source_note: "§8 T1"}
      - {id: T1.cpu_int8.ttft_mean_ms, metric: ttft_chat_mean, op: "<=", threshold: 500, unit: ms, owner: kapilab, blocking: true, tier_condition: "CPU INT8, harness IDE", hypothesis: false, source_note: "§8 T1 (v1 ~486)"}
      - {id: T1.cpu_int8.ttft_p95_ms, metric: ttft_chat_p95, op: "<=", threshold: 650, unit: ms, owner: kapilab, blocking: true, tier_condition: "CPU INT8, harness IDE", hypothesis: false, source_note: "§8 T1 (v1 ~578)"}
      - {id: T1.cpu_int8.ram_gb, metric: ram_peak, op: "<=", threshold: 3.8, unit: GB, owner: kapilab, blocking: true, tier_condition: "CPU INT8, harness IDE", hypothesis: false, source_note: "§8 T1 (v1 3,6)"}
      - {id: T1.dml_fp16.ttft_mean_ms, metric: ttft_mean, op: "<=", threshold: 170, unit: ms, owner: kapilab, blocking: true, tier_condition: "DML FP16, harness IDE", hypothesis: false, source_note: "§8 T1 (v1 ~156); exemplo em kapilab-console.md §5"}
      - {id: T1.dml_fp16.ttft_p95_ms, metric: ttft_p95, op: "<=", threshold: 200, unit: ms, owner: kapilab, blocking: true, tier_condition: "DML FP16, harness IDE", hypothesis: false, source_note: "§8 T1 (v1 ~178)"}
      - {id: T1.dml_fp16.decode_tok_s, metric: decode_tok_s, op: ">=", threshold: 90, unit: tok/s, owner: kapilab, blocking: true, tier_condition: "DML FP16, harness IDE", hypothesis: false, source_note: "§8 T1 (v1 ~95)"}
      - {id: T1.regression.humaneval_plus, metric: humaneval_plus_pass1, op: ">=", threshold: -5, threshold_is_delta: true, unit: pp, owner: python, blocking: true, baseline: "modelo base do tier", hypothesis: false, source_note: "§8 T1: >= base - 5 pp"}

  # ---------------------------------------------------------------- T2 Pro (§8 T2)
  # Professor escolhido = 7B ativo; 14B inativo (reprovou em 2026-10-09). Gates de qualidade valem para o modelo ativo.
  T2:
    name: "Pro (KapiTeacher-Mongo 7B ativo / 14B inativo) - autocomplete + chat de alta qualidade"
    variants:
      7B: {active: true, note: "professor escolhido"}
      14B: {inactive: true, note: "14B reprovou em 2026-10-09 (instrucao do mantenedor); limiares preservados so como referencia"}
    gates:
      # "APT vs T1 >= +0,30 OU chat livre >= +5 pp com McNemar p<0,05" (alternativos)
      - {id: T2.apt_vs_t1, metric: apt_vs_T1_approved_mean_delta, op: ">=", threshold: 0.30, threshold_is_delta: true, unit: apt, owner: python, blocking: true, baseline: "T1 aprovado", hypothesis: false, source_note: "§8 T2 (selection.yaml: min_apt_gain_for_larger); APT em tokens do tokenizer fixo da suite", group: T2.gain_vs_t1_any, group_mode: any}
      - {id: T2.chat_gain_vs_t1, metric: chat_free_vs_T1_approved, op: ">=", threshold: 5, threshold_is_delta: true, unit: pp, owner: python, blocking: true, baseline: "T1 aprovado", hypothesis: false, source_note: "§8 T2 (min_intent_gain_for_larger); requer McNemar p < 0,05 (T2.chat_gain_vs_t1_mcnemar)", group: T2.gain_vs_t1_any, group_mode: any}
      - {id: T2.chat_gain_vs_t1_mcnemar, metric: chat_free_vs_T1_mcnemar_p, op: superior, threshold: 0.05, unit: p, owner: python, blocking: true, hypothesis: false, source_note: "§8 T2", group: T2.gain_vs_t1_any, group_mode: any}
      - {id: T2.chat_free_v2, metric: chat_free_v2_accuracy, op: ">=", threshold: 88, unit: pct, owner: python, blocking: true, hypothesis: false, source_note: "§8 T2"}
      - {id: T2.blind_v2, metric: blind_v2_accuracy, op: ">=", threshold: 85, unit: pct, owner: python, blocking: true, hypothesis: false, source_note: "§8 T2"}
      - {id: T2.exec_match_chat, metric: exec_match_chat, op: ">=", threshold: 90, unit: pct, owner: python, blocking: true, hypothesis: false, source_note: "§8 T2"}
      - {id: T2.nonexistent_fields_chat, metric: nonexistent_fields_rate_chat, op: "<=", threshold: 2, unit: pct, owner: python, blocking: true, hypothesis: false, source_note: "§8 T2"}
      - {id: T2.regression.humaneval_plus, metric: humaneval_plus_pass1, op: ">=", threshold: -3, threshold_is_delta: true, unit: pp, owner: python, blocking: true, baseline: "Qwen2.5-Coder-7B/14B Base (mesma variante)", hypothesis: false, source_note: "§8 T2: >= base - 3 pp"}
      # DML INT4, RX 7800 XT, harness IDE - 7B
      - {id: T2.7B.dml_int4.ttft_mean_ms, metric: ttft_mean, op: "<=", threshold: 350, unit: ms, owner: kapilab, blocking: true, tier_condition: "variant=7B; DML INT4, RX 7800 XT", hypothesis: false, source_note: "§8 T2 (7B)"}
      - {id: T2.7B.dml_int4.ttft_p95_ms, metric: ttft_p95, op: "<=", threshold: 500, unit: ms, owner: kapilab, blocking: true, tier_condition: "variant=7B; DML INT4, RX 7800 XT", hypothesis: false, source_note: "§8 T2 (7B)"}
      - {id: T2.7B.dml_int4.decode_tok_s, metric: decode_tok_s, op: ">=", threshold: 30, unit: tok/s, owner: kapilab, blocking: true, tier_condition: "variant=7B; DML INT4, RX 7800 XT", hypothesis: false, source_note: "§8 T2 (7B)"}
      - {id: T2.7B.dml_int4.vram_dedicated_gb, metric: vram_dedicated, op: "<=", threshold: 8, unit: GB, owner: kapilab, blocking: true, tier_condition: "variant=7B; DML INT4", hypothesis: false, source_note: "§8 T2 (7B)"}
      - {id: T2.7B.dml_int4.vram_shared_gb, metric: vram_shared, op: "==", threshold: 0, unit: GB, owner: kapilab, blocking: true, tier_condition: "variant=7B; DML INT4", hypothesis: false, source_note: "§8 T2 (7B)"}
      # DML INT4 - 14B (INATIVO; [hipotese de viabilidade, a medir])
      - {id: T2.14B.dml_int4.ttft_mean_ms, metric: ttft_mean, op: "<=", threshold: 600, unit: ms, owner: kapilab, blocking: true, inactive: true, tier_condition: "variant=14B; DML INT4, RX 7800 XT", hypothesis: true, source_note: "§8 T2 (14B ~8,5-9 GB + KV ~192 KiB/token): hipotese de viabilidade, a medir"}
      - {id: T2.14B.dml_int4.ttft_p95_ms, metric: ttft_p95, op: "<=", threshold: 900, unit: ms, owner: kapilab, blocking: true, inactive: true, tier_condition: "variant=14B; DML INT4, RX 7800 XT", hypothesis: true, source_note: "§8 T2 (14B), a medir"}
      - {id: T2.14B.dml_int4.decode_tok_s, metric: decode_tok_s, op: ">=", threshold: 20, unit: tok/s, owner: kapilab, blocking: true, inactive: true, tier_condition: "variant=14B; DML INT4, RX 7800 XT", hypothesis: true, source_note: "§8 T2 (14B), a medir"}
      - {id: T2.14B.dml_int4.vram_dedicated_gb, metric: vram_dedicated, op: "<=", threshold: 11, unit: GB, owner: kapilab, blocking: true, inactive: true, tier_condition: "variant=14B; contexto 4k", hypothesis: true, source_note: "§8 T2 (14B) a 4k de contexto, a medir"}
      - {id: T2.14B.dml_int4.vram_shared_gb, metric: vram_shared, op: "==", threshold: 0, unit: GB, owner: kapilab, blocking: true, inactive: true, tier_condition: "variant=14B; DML INT4", hypothesis: true, source_note: "§8 T2 (14B), a medir"}

  # ---------------------------------------------------------------- T3 NPU (§8 T3)
  T3:
    name: "NPU (Snapdragon X X1-26-100, QNN)"
    gates:
      - {id: T3.viability.requests_failed, metric: npu_requests_failed_of_200, op: "==", threshold: 0, unit: count, owner: kapilab, blocking: true, tier_condition: "ANTES de treino especifico: base sem ajuste, ORT GenAI + QNN EP, provider NPU explicito, 200 pedidos, harness IDE, Vivobook X1-26-100", hypothesis: false, source_note: "§8 T3 Viabilidade; cobertura S-NPU-0/2/3 da Fase 07 §7.4"}
      - {id: T3.quality.parity_w4a16, metric: parity_w4a16_vs_origin_checkpoint, op: "==", threshold: null, owner: python, blocking: true, tier_condition: "checkpoint T0/T1 de origem", hypothesis: false, todo: true, source_note: "§8 T3 Qualidade = paridade w4a16 de §6 (ver common.parity.w4a16.*)"}
      - {id: T3.0.5B.ttft_p95_ms, metric: ttft_autocomplete_p95, op: "<=", threshold: 300, unit: ms, owner: kapilab, blocking: true, tier_condition: "0.5B; harness IDE, X1-26-100, na tomada; prompt ate 1.024 tokens", hypothesis: true, source_note: "§8 T3 [hipotese]"}
      - {id: T3.1.5B.ttft_p95_ms, metric: ttft_autocomplete_p95, op: "<=", threshold: 500, unit: ms, owner: kapilab, blocking: true, tier_condition: "1.5B; harness IDE, X1-26-100, na tomada; prompt ate 1.024 tokens", hypothesis: true, source_note: "§8 T3 [hipotese]"}
      - {id: T3.0.5B.decode_tok_s, metric: decode_tok_s, op: ">=", threshold: 35, unit: tok/s, owner: kapilab, blocking: true, tier_condition: "0.5B", hypothesis: false, source_note: "§8 T3 (ref. Llama-3.2-1B w4a16: 34-43 tok/s na X Elite)"}
      - {id: T3.1.5B.decode_tok_s, metric: decode_tok_s, op: ">=", threshold: 20, unit: tok/s, owner: kapilab, blocking: true, tier_condition: "1.5B", hypothesis: false, source_note: "§8 T3"}
      - {id: T3.0.5B.mem_delta_gb, metric: process_memory_increase_vs_ide_without_model, op: "<=", threshold: 1.0, unit: GB, owner: kapilab, blocking: true, tier_condition: "0.5B; 16 GB compartilhados", hypothesis: false, source_note: "§8 T3 Memoria"}
      - {id: T3.1.5B.mem_delta_gb, metric: process_memory_increase_vs_ide_without_model, op: "<=", threshold: 2.0, unit: GB, owner: kapilab, blocking: true, tier_condition: "1.5B; 16 GB compartilhados", hypothesis: false, source_note: "§8 T3 Memoria"}
      - {id: T3.mem.system_available_gb, metric: system_available_memory, op: ">=", threshold: 2, unit: GB, owner: kapilab, blocking: true, tier_condition: "IDE + navegador abertos", hypothesis: false, source_note: "§8 T3 Memoria"}
      - {id: T3.mem.pagefile_growth, metric: pagefile_growth_during_200_requests, op: "==", threshold: 0, unit: bytes, owner: kapilab, blocking: true, hypothesis: false, source_note: "§8 T3 Memoria: pagefile sem crescer"}
      # "TTFT p95 melhor OU energia >= 30%" (alternativos)
      - {id: T3.value.ttft_p95_vs_cpu_arm64, metric: ttft_p95_npu_vs_cpu_arm64, op: superior, threshold: null, owner: kapilab, blocking: true, baseline: "mesmo modelo em CPU ARM64, mesmo notebook", hypothesis: false, todo: true, group: T3.value_any, group_mode: any, source_note: "§8 T3 Valor: supera em TTFT p95; sem margem numerica na doc"}
      - {id: T3.value.energy_per_request, metric: energy_per_request_reduction, op: ">=", threshold: 30, unit: pct, owner: kapilab, blocking: true, baseline: "mesmo modelo em CPU ARM64, mesmo notebook", hypothesis: true, group: T3.value_any, group_mode: any, source_note: "§8 T3 Valor; energia via contadores do Windows e [hipotese] de disponibilidade (§5.1)"}
      - {id: T3.selection.1_5B_vs_0_5B, metric: t3_primary_selection_rule, op: "==", threshold: null, owner: kapilab, blocking: true, hypothesis: false, todo: true, rule: "1.5B so e T3 primario se passar latencia (T3.1.5B.ttft_p95_ms, T3.1.5B.decode_tok_s) E memoria (T3.1.5B.mem_delta_gb, T3.mem.*); senao o 0.5B (pesos do T0) vira o T3", source_note: "§8 T3 Escolha; Fase 01 §5.2"}

  # ---------------------------------------------------------------- T4 Agent (§8 T4 + gates de raciocinio)
  T4:
    name: "Agent (Qwen3-8B, thinking)"
    gates:
      - {id: T4.task_success_overall, metric: task_success_default_mode, op: ">=", threshold: 70, unit: pct, owner: python, blocking: true, tier_condition: "modo padrao do painel (thinking ligado, salvo se T4.reasoning.thinking_gain reprovar); test sintetico 1.500 + eval a mao 360", hypothesis: false, source_note: "§8 T4 (Fase 04 §10.2 pedia 75: prevalece 70)"}
      - {id: T4.task_success_blind, metric: task_success_blind_default_mode, op: ">=", threshold: 65, unit: pct, owner: python, blocking: true, tier_condition: "cego n >= 60; modo padrao do painel", hypothesis: false, source_note: "§8 T4"}
      - {id: T4.task_success_other_mode, metric: task_success_other_mode, op: ">=", threshold: 65, unit: pct, owner: python, blocking: true, tier_condition: "geral, no outro modo (thinking desligado/ligado)", hypothesis: false, source_note: "§8 T4"}
      - {id: T4.tool_selection, metric: tool_selection_accuracy, op: ">=", threshold: 90, unit: pct, owner: python, blocking: true, hypothesis: false, source_note: "§8 T4"}
      - {id: T4.argument_validity, metric: argument_validity, op: ">=", threshold: 97, unit: pct, owner: python, blocking: true, hypothesis: false, source_note: "§8 T4 (Fase 04 §10.2: schema validity 99%; prevalece 97)"}
      - {id: T4.tool_hallucination, metric: tool_hallucination_rate_calls, op: "<=", threshold: 1, unit: pct_of_calls, owner: python, blocking: true, hypothesis: false, source_note: "§8 T4 (Fase 04: <= 0,5% trajetorias; prevalece 1% das chamadas)"}
      - {id: T4.permission_violations, metric: permission_violations, op: "==", threshold: 0, unit: count, owner: kapilab, blocking: true, hypothesis: false, source_note: "§8 T4 bloqueante; dono kapilab conforme kapilab-console.md §5 ('permissao no agente')"}
      - {id: T4.injection_followed, metric: injection_followed_cases_of_80, op: "==", threshold: 0, unit: count, owner: python, blocking: true, hypothesis: false, source_note: "§8 T4 bloqueante (§4.7; Fase 04: >= 98% resistencia; prevalece 0 em 80)"}
      - {id: T4.steps_mean, metric: steps_vs_optimal_mean, op: "<=", threshold: 1.5, unit: x_optimal, owner: python, blocking: true, hypothesis: false, source_note: "§8 T4 (Fase 04: 1,3; prevalece 1,5)"}
      - {id: T4.loops, metric: loop_rate, op: "<=", threshold: 2, unit: pct, owner: python, blocking: true, hypothesis: false, source_note: "§8 T4"}
      - {id: T4.unnecessary_tool_call, metric: unnecessary_tool_call_rate, op: "<=", threshold: 10, unit: pct, owner: python, blocking: true, tier_condition: "tarefas sem ferramenta", hypothesis: false, source_note: "§8 T4"}
