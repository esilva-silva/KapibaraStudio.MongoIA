      - {id: T4.lite.thinking_vs_off, metric: lite_task_success_thinking512_vs_off, op: noninferior, threshold: null, margin: 2, unit: pp, owner: python, blocking: false, tier_condition: "Agent-Lite 1.7B, thinking curto (512)", hypothesis: true, fallback: "Lite sem thinking", source_note: "§8 raciocinio: margem 2 pp"}
      - {id: T4.lite.budget_overflow, metric: budget_overflow_rate, op: "<=", threshold: 10, unit: pct_of_generations, owner: kapilab, blocking: false, tier_condition: "Agent-Lite 1.7B", hypothesis: true, fallback: "Lite sem thinking", source_note: "§8 raciocinio"}
