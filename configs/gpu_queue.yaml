  # so greedy em GGUF Q8_0 via llama-server, ranking SEM gold, amostra T=0,2 so numa 2a passada dos rejeitados, KD por logits adiado.
  # PRE-REQUISITO (CPU, ~2 min; ja executado): env/.venv/Scripts/python.exe -I scripts/distill/build_prompt_pool.py --report reports/distill/pool-v2c-300k.md
  # Ordem: J12 (gera) -> J13 (filtra: passada 1) -> J12b (amostras dos rejeitados) -> J13b (filtro final com greedy + amostras).
  # NADA aqui foi iniciado. Se pular o J12b, o resultado do J13 ja e o final.
  - id: J12-distill-generate
    title: "Destilacao: greedy do KapiTeacher (sft_v2d, GGUF Q8_0, llama-server Vulkan) sobre 300k prompts FIM"
    status: ready
    command: ["{python}", "-I", "scripts/distill/generate_teacher.py", "--backend", "llama-server", "--gguf", "q8_0", "--slots", "8",
              "--samples", "0", "--resume"]
    depends_on: []
    requires_files:
      - data/distilled/v2c/pool/pool.manifest.json
      - Repos/KapiTeacher-Mongo-7B/gguf/kapiteacher-mongo-7b-sft_v2d-Q8_0.gguf
      - cache/llama.cpp/b11693/bin/llama-server.exe
    watch_files:
      - data/distilled/v2c/gen/heartbeat.json
    done_marker: data/distilled/v2c/gen/gen_summary.json
    max_restarts: 3
    watchdog_minutes: 30
    window: any
    estimate_hours: {hours: 20, basis: "300k prompts / 4,3 ex/s (piloto Q8_0 greedy, 8 slots) = 19,4 h", conservative_hours: 28}
  # J13: passada 1 do filtro (validador completo + dedup + decontaminacao k=2). CPU + MongoDB (WSL; manter `wsl -d Ubuntu -e sleep infinity`).
