              "--contract", "fim-raw", "--n", "500", "--load", "nf4", "--name", "sft_v2c-final-generic-js", "--resume",
              "--ids-from", "Repos/KapiTeacher-Mongo-7B/reports/baseline_base/Qwen2.5-Coder-7B-generic-js/sample_ids.json",
              "--out-root", "Repos/KapiTeacher-Mongo-7B/reports/eval"]
    depends_on: [J09-teacher-sft-v2c]
    requires_files:
