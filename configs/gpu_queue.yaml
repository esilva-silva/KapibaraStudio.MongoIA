    estimate_hours: {measured_tok_s: 506, conservative_tok_s: 360, tokens: 13485182, steps: 295, train_hours: 7.4, with_evals_hours: 9.7, conservative_train_hours: 10.4, conservative_hours: 12.7, budget_hours: 16, replay_token_share: 0.12}
