    max_restarts: 1
    watchdog_minutes: 240
    window: any
    estimate_hours: {hours: 1.5, basis: "piloto 1000 prompts = 66 s (50 s fixos de indice de avaliacao); decontaminacao por registro domina; 300k ~1-2 h"}
  # J12b (OPCIONAL): 2a passada, SO amostras (T=0,2, seed por item) dos prompts cuja greedy foi rejeitada na validacao (~5,5% = ~16k) e sem aceita.
