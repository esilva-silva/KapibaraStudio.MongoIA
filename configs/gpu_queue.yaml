# gpu_queue.yaml - fila da GPU local (docs/fase-05-treinamento.md §4.2 e §9.6). Consumida por scripts/gpu_queue.ps1.
# Uma GPU, um job por vez (tmp/gpu.lock, detido pela fila). Estado de execucao em reports/gpu_queue/state.json (este arquivo e so declarativo);
# incidentes em reports/gpu_queue/incidents.md; logs em logs/gpu_queue/<job>.log.
#
#   .\scripts\gpu_queue.ps1 -Status                 # o que esta pronto/rodando/pendente
#   .\scripts\gpu_queue.ps1 -Start                  # inicia a fila (jobs `ready` e dependencias satisfeitas, em ordem)
#   .\scripts\gpu_queue.ps1 -Start -Only J09-teacher-sft-v2c
#   .\scripts\gpu_queue.ps1 -Pause / -Resume        # pausa cooperativa (tmp/gpu.pause): checkpoint no passo seguinte e GPU livre
version: 1
python: C:/SlopStudio.MongoAI-artifacts/.venv/Scripts/python.exe   # venv ROCm do bake-off (nao instalar torch novo)
workdir: .
lock_file: tmp/gpu.lock
pause_file: tmp/gpu.pause
state_file: reports/gpu_queue/state.json
incidents_file: reports/gpu_queue/incidents.md
log_dir: logs/gpu_queue
poll_seconds: 30
# Verificacao de ambiente antes de cada (re)lancamento: o relancamento so ocorre com a GPU respondendo (sem fallback CPU).
env_check: ["-I", "scripts/teacher/check_gpu.py"]
env_check_timeout_s: 180
env_check_retries: 10          # x poll_seconds * 2 (aguarda TDR/driver voltar)

defaults:
  max_restarts: 3              # relancamentos com --resume auto; na 3a falha segue para o proximo job sem dependencia
  watchdog_minutes: 15         # sem avanco de metrics.jsonl/heartbeat.json por 15 min => mata a arvore de processos e relanca
  window: any                  # any | "HH:mm-HH:mm" (janela permitida para INICIAR; ex.: "19:00-08:00" noite)
  window_enforce: false        # true: ao sair da janela cria tmp/gpu.pause (pausa cooperativa)

jobs:
  # ---------------------------------------------------------------------------------------------------------------------------------
  # J04b: baseline do base (zero-shot) no MESMO val v2c e contrato do professor; referencia pareada de G2.2/G2.5 e teste do pipeline de
  # avaliacao antes das ~21 h do J09. Precisa do MongoDB (WSL: `wsl -- true`) so na fase `score`; falha aqui nao bloqueia o J09.
  - id: J04b-base-v2c-val
    title: "Baseline Qwen2.5-Coder-7B (NF4) no val v2c, editor-context-v1, n=2000"
    status: ready
    command: ["{python}", "-I", "scripts/teacher/eval_teacher.py", "--model", "BaseRepos/Qwen2.5-Coder-7B", "--data-version", "v2c",
              "--split", "val", "--contract", "editor-context-v1", "--n", "2000", "--name", "base-v2c", "--resume",
              "--out-root", "Repos/KapiTeacher-Mongo-7B/reports/eval"]
    depends_on: []
    requires_files: [data/validated/v2c/manifest.json]
    watch_files: [Repos/KapiTeacher-Mongo-7B/reports/eval/base-v2c/predictions.jsonl]
    done_marker: Repos/KapiTeacher-Mongo-7B/reports/eval/base-v2c/summary.json
    max_restarts: 2
    watchdog_minutes: 20
    estimate_hours: {hours: 0.6}
  # ---------------------------------------------------------------------------------------------------------------------------------
  # J09 (Fase 05 §9.2): professor SFT it.1 sobre o corpus v2c. ENFILEIRADO, NAO INICIADO: nada roda ate `gpu_queue.ps1 -Start`.
  # Partida manual equivalente (sem a fila; usa o mesmo lock):
  #   C:/SlopStudio.MongoAI-artifacts/.venv/Scripts/python.exe -I scripts/teacher/train_teacher.py \
  #       --config Repos/KapiTeacher-Mongo-7B/configs/sft_v2c.yaml --resume auto
  - id: J09-teacher-sft-v2c
    title: "KapiTeacher-Mongo-7B SFT QLoRA it.1 (corpus v2c + replay 12%, sem CPT, 1 epoca)"
    status: ready
    command: ["{python}", "-I", "scripts/teacher/train_teacher.py", "--config", "Repos/KapiTeacher-Mongo-7B/configs/sft_v2c.yaml",
              "--resume", "auto"]
    depends_on: []
    requires_files:
      - data/teacher/v2c/manifest.json
      - data/replay/v1/manifest.json
      - Repos/KapiTeacher-Mongo-7B/configs/sft_v2c.yaml
    watch_files:                       # avanco = mtime mais recente entre estes
      - Repos/KapiTeacher-Mongo-7B/reports/sft_v2c/metrics.jsonl
      - Repos/KapiTeacher-Mongo-7B/reports/sft_v2c/heartbeat.json
    done_marker: Repos/KapiTeacher-Mongo-7B/adapters/sft_v2c/final/adapter_model.safetensors
    max_restarts: 3
    watchdog_minutes: 15
    window: any
    pause_exit_codes: [75]             # 75 = pausa cooperativa (nao conta como falha)
    estimate_hours: {measured_tok_s: 506, conservative_tok_s: 360, tokens: 37099525, steps: 811, train_hours: 20.4, with_evals_hours: 22.7, conservative_train_hours: 28.6, conservative_hours: 30.9, budget_hours: 34, replay_token_share: 0.12, cut_order: "README_job.md §6"}
  # ---------------------------------------------------------------------------------------------------------------------------------
  # J11 (Fase 05 §9.2): avaliacao do professor (G2.2/G2.3/G2.5) no val v2c; so apos o J09. Nao inicia sozinho antes do adapter final.
