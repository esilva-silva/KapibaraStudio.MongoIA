# gpu_queue.yaml - fila da GPU local (docs/fase-05-treinamento.md §4.2 e §9.6). Consumida por scripts/gpu_queue.ps1.
# Uma GPU, um job por vez (tmp/gpu.lock, detido pela fila). Estado de execucao em reports/gpu_queue/state.json (este arquivo e so declarativo);
# incidentes em reports/gpu_queue/incidents.md; logs em logs/gpu_queue/<job>.log.
#
#   .\scripts\gpu_queue.ps1 -Status                 # o que esta pronto/rodando/pendente
#   .\scripts\gpu_queue.ps1 -Start                  # inicia a fila (jobs `ready` e dependencias satisfeitas, em ordem)
#   .\scripts\gpu_queue.ps1 -Start -Only J09-teacher-sft-v2c
#   .\scripts\gpu_queue.ps1 -Pause / -Resume        # pausa cooperativa (tmp/gpu.pause): checkpoint no passo seguinte e GPU livre
version: 1
python: C:/SlopStudio.MongoAI-artifacts/.venv/Scripts/python.exe   # venv ROCm do bake-off (nao instalar torch novo)
workdir: .
lock_file: tmp/gpu.lock
pause_file: tmp/gpu.pause
state_file: reports/gpu_queue/state.json
incidents_file: reports/gpu_queue/incidents.md
log_dir: logs/gpu_queue
poll_seconds: 30
# Verificacao de ambiente antes de cada (re)lancamento: o relancamento so ocorre com a GPU respondendo (sem fallback CPU).
env_check: ["-I", "scripts/teacher/check_gpu.py"]
env_check_timeout_s: 180
env_check_retries: 10          # x poll_seconds * 2 (aguarda TDR/driver voltar)

defaults:
  max_restarts: 3              # relancamentos com --resume auto; na 3a falha segue para o proximo job sem dependencia
  watchdog_minutes: 15         # sem avanco de metrics.jsonl/heartbeat.json por 15 min => mata a arvore de processos e relanca
  window: any                  # any | "HH:mm-HH:mm" (janela permitida para INICIAR; ex.: "19:00-08:00" noite)
  window_enforce: false        # true: ao sair da janela cria tmp/gpu.pause (pausa cooperativa)

jobs:
  # ---------------------------------------------------------------------------------------------------------------------------------
  # J04b: baseline do base (zero-shot) no MESMO val v2c e contrato do professor; referencia pareada de G2.2/G2.5 e teste do pipeline de
  # avaliacao antes das ~21 h do J09. Precisa do MongoDB (WSL: `wsl -- true`) so na fase `score`; falha aqui nao bloqueia o J09.
  - id: J04b-base-v2c-val
    title: "Baseline Qwen2.5-Coder-7B (NF4) no val v2c, editor-context-v1, n=2000"
    status: ready
    command: ["{python}", "-I", "scripts/teacher/eval_teacher.py", "--model", "BaseRepos/Qwen2.5-Coder-7B", "--data-version", "v2c",
              "--split", "val", "--contract", "editor-context-v1", "--n", "2000", "--name", "base-v2c", "--resume",
              "--out-root", "Repos/KapiTeacher-Mongo-7B/reports/eval"]
    depends_on: []
    requires_files: [data/validated/v2c/manifest.json]
    watch_files: [Repos/KapiTeacher-Mongo-7B/reports/eval/base-v2c/predictions.jsonl]
    done_marker: Repos/KapiTeacher-Mongo-7B/reports/eval/base-v2c/summary.json
    max_restarts: 2
    watchdog_minutes: 20
    estimate_hours: {hours: 0.6}
  # ---------------------------------------------------------------------------------------------------------------------------------
  # J09 (Fase 05 §9.2): professor SFT it.1 sobre o corpus v2c. ENFILEIRADO, NAO INICIADO: nada roda ate `gpu_queue.ps1 -Start`.
  # Partida manual equivalente (sem a fila; usa o mesmo lock):
  #   C:/SlopStudio.MongoAI-artifacts/.venv/Scripts/python.exe -I scripts/teacher/train_teacher.py \
  #       --config Repos/KapiTeacher-Mongo-7B/configs/sft_v2c.yaml --resume auto
  - id: J09-teacher-sft-v2c
    title: "KapiTeacher-Mongo-7B SFT QLoRA it.1 (corpus v2c + replay 12%, sem CPT, 1 epoca)"
    status: ready
    command: ["{python}", "-I", "scripts/teacher/train_teacher.py", "--config", "Repos/KapiTeacher-Mongo-7B/configs/sft_v2c.yaml",
              "--resume", "auto"]
    depends_on: []
    requires_files:
      - data/teacher/v2c/manifest.json
      - data/replay/v1/manifest.json
      - Repos/KapiTeacher-Mongo-7B/configs/sft_v2c.yaml
    watch_files:                       # avanco = mtime mais recente entre estes
      - Repos/KapiTeacher-Mongo-7B/reports/sft_v2c/metrics.jsonl
      - Repos/KapiTeacher-Mongo-7B/reports/sft_v2c/heartbeat.json
    done_marker: Repos/KapiTeacher-Mongo-7B/adapters/sft_v2c/final/adapter_model.safetensors
    max_restarts: 3
    watchdog_minutes: 15
    window: any
    pause_exit_codes: [75]             # 75 = pausa cooperativa (nao conta como falha)
    estimate_hours: {measured_tok_s: 506, conservative_tok_s: 360, tokens: 37099525, steps: 811, train_hours: 20.4, with_evals_hours: 22.7, conservative_train_hours: 28.6, conservative_hours: 30.9, budget_hours: 34, replay_token_share: 0.12, cut_order: "README_job.md §6"}
  # ---------------------------------------------------------------------------------------------------------------------------------
  # J11 (Fase 05 §9.2): avaliacao do professor (G2.2/G2.3/G2.5) no val v2c; so apos o J09. Nao inicia sozinho antes do adapter final.
  - id: J11-teacher-eval-val
    title: "Avaliacao do KapiTeacher no val v2c (FIM, adapter final)"
    status: waiting
    command: ["{python}", "-I", "scripts/teacher/eval_teacher.py", "--model", "BaseRepos/Qwen2.5-Coder-7B", "--adapter",
              "Repos/KapiTeacher-Mongo-7B/adapters/sft_v2c/final", "--data-version", "v2c", "--split", "val",
              "--contract", "editor-context-v1", "--n", "2000", "--name", "sft_v2c-final", "--resume",
              "--ids-from", "Repos/KapiTeacher-Mongo-7B/reports/eval/base-v2c/sample_ids.json",
              "--out-root", "Repos/KapiTeacher-Mongo-7B/reports/eval"]
    depends_on: [J09-teacher-sft-v2c]
    requires_files:
      - Repos/KapiTeacher-Mongo-7B/adapters/sft_v2c/final/adapter_model.safetensors
      - Repos/KapiTeacher-Mongo-7B/reports/eval/base-v2c/sample_ids.json
    watch_files:
      - Repos/KapiTeacher-Mongo-7B/reports/eval/sft_v2c-final/predictions.jsonl
    done_marker: Repos/KapiTeacher-Mongo-7B/reports/eval/sft_v2c-final/summary.json
    max_restarts: 3
    watchdog_minutes: 20
    window: any
    estimate_hours: {hours: 1.0}
  # ---------------------------------------------------------------------------------------------------------------------------------
  # J11b: G2.5 (Generic-JS FIM, 500 cortes de pacotes npm holdout, data/replay/v1). O baseline do base (NF4) ja existe em
  # reports/baseline_base/Qwen2.5-Coder-7B-generic-js; aqui o adapter final na MESMA amostra. Sem Mongo. So apos o J09.
  - id: J11b-teacher-eval-generic-js
    title: "G2.5: adapter final no generic_js_fim_eval (500 cortes FIM)"
    status: waiting
    command: ["{python}", "-I", "scripts/teacher/eval_teacher.py", "--model", "BaseRepos/Qwen2.5-Coder-7B", "--adapter",
              "Repos/KapiTeacher-Mongo-7B/adapters/sft_v2c/final", "--data-version", "generic-js", "--split", "eval",
              "--contract", "fim-raw", "--n", "500", "--load", "nf4", "--name", "sft_v2c-final-generic-js", "--resume",
              "--ids-from", "Repos/KapiTeacher-Mongo-7B/reports/baseline_base/Qwen2.5-Coder-7B-generic-js/sample_ids.json",
              "--out-root", "Repos/KapiTeacher-Mongo-7B/reports/eval"]
    depends_on: [J09-teacher-sft-v2c]
    requires_files:
      - Repos/KapiTeacher-Mongo-7B/adapters/sft_v2c/final/adapter_model.safetensors
      - Repos/KapiTeacher-Mongo-7B/reports/baseline_base/Qwen2.5-Coder-7B-generic-js/summary.json
    watch_files:
      - Repos/KapiTeacher-Mongo-7B/reports/eval/sft_v2c-final-generic-js/predictions.jsonl
    done_marker: Repos/KapiTeacher-Mongo-7B/reports/eval/sft_v2c-final-generic-js/summary.json
    max_restarts: 3
    watchdog_minutes: 20
    window: any
    estimate_hours: {hours: 0.3}
  # ---------------------------------------------------------------------------------------------------------------------------------
  # J09b (it.2): aquecimento a partir de sft_v2c/final com o corpus v2d (13,5 M tokens, 295 passos, LR 5e-5). ENFILEIRADO, NAO INICIADO.
  # Manual: python -I scripts/teacher/train_teacher.py --config Repos/KapiTeacher-Mongo-7B/configs/sft_v2d.yaml --resume auto
  - id: J09b-teacher-sft-v2d
    title: "KapiTeacher-Mongo-7B SFT it.2 (aquecimento do sft_v2c/final, corpus v2d + replay 12%, LR 5e-5)"
    status: ready
    command: ["{python}", "-I", "scripts/teacher/train_teacher.py", "--config", "Repos/KapiTeacher-Mongo-7B/configs/sft_v2d.yaml",
              "--resume", "auto"]
    depends_on: []
    requires_files:
      - data/teacher/v2d/manifest.json
      - data/replay/v1/manifest.json
      - Repos/KapiTeacher-Mongo-7B/configs/sft_v2d.yaml
      - Repos/KapiTeacher-Mongo-7B/adapters/sft_v2c/final/adapter_model.safetensors
    watch_files:
      - Repos/KapiTeacher-Mongo-7B/reports/sft_v2d/metrics.jsonl
      - Repos/KapiTeacher-Mongo-7B/reports/sft_v2d/heartbeat.json
    done_marker: Repos/KapiTeacher-Mongo-7B/adapters/sft_v2d/final/adapter_model.safetensors
    max_restarts: 3
    watchdog_minutes: 15
    window: any
    pause_exit_codes: [75]
    estimate_hours: {measured_tok_s: 506, conservative_tok_s: 360, tokens: 13485182, steps: 295, train_hours: 7.4, with_evals_hours: 9.7, conservative_train_hours: 10.4, conservative_hours: 12.7, budget_hours: 16, replay_token_share: 0.12}
  # J11c: val v2c (MESMOS ids do base-v2c), adapter v2d final.
  - id: J11c-teacher-eval-val-v2d
    title: "Avaliacao do KapiTeacher it.2 no val v2c (FIM, adapter sft_v2d final, mesma amostra)"
    status: waiting
    command: ["{python}", "-I", "scripts/teacher/eval_teacher.py", "--model", "BaseRepos/Qwen2.5-Coder-7B", "--adapter",
              "Repos/KapiTeacher-Mongo-7B/adapters/sft_v2d/final", "--data-version", "v2c", "--split", "val",
              "--contract", "editor-context-v1", "--n", "2000", "--name", "sft_v2d-final", "--resume",
              "--ids-from", "Repos/KapiTeacher-Mongo-7B/reports/eval/base-v2c/sample_ids.json",
              "--out-root", "Repos/KapiTeacher-Mongo-7B/reports/eval"]
    depends_on: [J09b-teacher-sft-v2d]
    requires_files:
      - Repos/KapiTeacher-Mongo-7B/adapters/sft_v2d/final/adapter_model.safetensors
      - Repos/KapiTeacher-Mongo-7B/reports/eval/base-v2c/sample_ids.json
    watch_files:
      - Repos/KapiTeacher-Mongo-7B/reports/eval/sft_v2d-final/predictions.jsonl
    done_marker: Repos/KapiTeacher-Mongo-7B/reports/eval/sft_v2d-final/summary.json
    max_restarts: 3
    watchdog_minutes: 20
    window: any
    estimate_hours: {hours: 1.0}
  # J11d: G2.5 generic-js do adapter v2d.
  - id: J11d-teacher-eval-generic-js-v2d
    title: "G2.5: adapter sft_v2d final no generic_js_fim_eval (500 cortes FIM)"
    status: waiting
    command: ["{python}", "-I", "scripts/teacher/eval_teacher.py", "--model", "BaseRepos/Qwen2.5-Coder-7B", "--adapter",
              "Repos/KapiTeacher-Mongo-7B/adapters/sft_v2d/final", "--data-version", "generic-js", "--split", "eval",
              "--contract", "fim-raw", "--n", "500", "--load", "nf4", "--name", "sft_v2d-final-generic-js", "--resume",
              "--ids-from", "Repos/KapiTeacher-Mongo-7B/reports/baseline_base/Qwen2.5-Coder-7B-generic-js/sample_ids.json",
              "--out-root", "Repos/KapiTeacher-Mongo-7B/reports/eval"]
    depends_on: [J09b-teacher-sft-v2d]
    requires_files:
      - Repos/KapiTeacher-Mongo-7B/adapters/sft_v2d/final/adapter_model.safetensors
      - Repos/KapiTeacher-Mongo-7B/reports/baseline_base/Qwen2.5-Coder-7B-generic-js/summary.json
    watch_files:
      - Repos/KapiTeacher-Mongo-7B/reports/eval/sft_v2d-final-generic-js/predictions.jsonl
    done_marker: Repos/KapiTeacher-Mongo-7B/reports/eval/sft_v2d-final-generic-js/summary.json
    max_restarts: 3
    watchdog_minutes: 20
    window: any
    estimate_hours: {hours: 0.3}
  # ---------------------------------------------------------------------------------------------------------------------------------
  # Destilacao sequence-level, autocomplete FIM (chat fora ate a decisao Q1). Decisoes do usuario (2026-10-17): pool de 300k prompts,
  # so greedy em GGUF Q8_0 via llama-server, ranking SEM gold, amostra T=0,2 so numa 2a passada dos rejeitados, KD por logits adiado.
  # PRE-REQUISITO (CPU, ~2 min; ja executado): env/.venv/Scripts/python.exe -I scripts/distill/build_prompt_pool.py --report reports/distill/pool-v2c-300k.md
  # Ordem: J12 (gera) -> J13 (filtra: passada 1) -> J12b (amostras dos rejeitados) -> J13b (filtro final com greedy + amostras).
  # NADA aqui foi iniciado. Se pular o J12b, o resultado do J13 ja e o final.
  - id: J12-distill-generate
    title: "Destilacao: greedy do KapiTeacher (sft_v2d, GGUF Q8_0, llama-server Vulkan) sobre 300k prompts FIM"
    status: ready
    command: ["{python}", "-I", "scripts/distill/generate_teacher.py", "--backend", "llama-server", "--gguf", "q8_0", "--slots", "8",
              "--samples", "0", "--resume"]
    depends_on: []
    requires_files:
      - data/distilled/v2c/pool/pool.manifest.json
      - Repos/KapiTeacher-Mongo-7B/gguf/kapiteacher-mongo-7b-sft_v2d-Q8_0.gguf
      - cache/llama.cpp/b11693/bin/llama-server.exe
    watch_files:
      - data/distilled/v2c/gen/heartbeat.json
    done_marker: data/distilled/v2c/gen/gen_summary.json
    max_restarts: 3
    watchdog_minutes: 30
    window: any
    estimate_hours: {hours: 20, basis: "300k prompts / 4,3 ex/s (piloto Q8_0 greedy, 8 slots) = 19,4 h", conservative_hours: 28}
  # J13: passada 1 do filtro (validador completo + dedup + decontaminacao k=2). CPU + MongoDB (WSL; manter `wsl -d Ubuntu -e sleep infinity`).
  - id: J13-distill-filter
    title: "Destilacao: filtro das candidatas (passada 1) -> data/distilled/v2c/{accepted,rejected}.jsonl"
    status: waiting
    command: ["env/.venv/Scripts/python.exe", "-I", "scripts/distill/filter_teacher.py", "--gen", "data/distilled/v2c/gen"]
    depends_on: [J12-distill-generate]
    requires_files:
      - data/distilled/v2c/gen/gen_summary.json
      - data/distilled/v2c/eval_docs.jsonl
    watch_files:
      - data/distilled/v2c/gen/gen_summary.json
    done_marker: data/distilled/v2c/filter_report.json
    max_restarts: 1
    watchdog_minutes: 240
    window: any
    estimate_hours: {hours: 1.5, basis: "piloto 1000 prompts = 66 s (50 s fixos de indice de avaliacao); decontaminacao por registro domina; 300k ~1-2 h"}
  # J12b (OPCIONAL): 2a passada, SO amostras (T=0,2, seed por item) dos prompts cuja greedy foi rejeitada na validacao (~5,5% = ~16k) e sem aceita.
  - id: J12b-distill-retry
    title: "Destilacao: amostra T=0,2 dos ~5,5% rejeitados pela validacao (2a passada, opcional)"
    status: waiting
    command: ["{python}", "-I", "scripts/distill/generate_teacher.py", "--backend", "llama-server", "--gguf", "q8_0", "--slots", "8",
              "--retry-from", "data/distilled/v2c", "--samples", "1", "--resume"]
    depends_on: [J13-distill-filter]
    requires_files:
      - data/distilled/v2c/rejected.jsonl
      - data/distilled/v2c/accepted.jsonl
    watch_files:
      - data/distilled/v2c/gen-retry/heartbeat.json
    done_marker: data/distilled/v2c/gen-retry/gen_summary.json
    max_restarts: 2
    watchdog_minutes: 30
    window: any
    estimate_hours: {hours: 1.2, basis: "~16k prompts a ~4 ex/s (so a amostra, 1 requisicao por prompt)"}
  # J13b (OPCIONAL, apos o J12b): filtro final com greedy + amostras; grava em data/distilled/v2c-final (a passada 1 em data/distilled/v2c fica intacta).
  - id: J13b-distill-filter-final
    title: "Destilacao: filtro final (greedy + 2a passada) -> data/distilled/v2c-final/{accepted,rejected}.jsonl"
    status: waiting
    command: ["env/.venv/Scripts/python.exe", "-I", "scripts/distill/filter_teacher.py", "--gen", "data/distilled/v2c/gen", "data/distilled/v2c/gen-retry",
              "--out", "data/distilled/v2c-final", "--eval-cache", "data/distilled/v2c", "--name", "v2c-final"]
    depends_on: [J12b-distill-retry]
    requires_files:
      - data/distilled/v2c/gen-retry/gen_summary.json
    watch_files:
      - data/distilled/v2c/gen-retry/gen_summary.json
    done_marker: data/distilled/v2c-final/filter_report.json
    max_restarts: 1
    watchdog_minutes: 240
    window: any
    estimate_hours: {hours: 1.5}
