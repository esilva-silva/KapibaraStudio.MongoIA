# gpu_compat.yaml - tabela de decisao GPU -> variante de autocomplete do Kapibara Studio (legivel por maquina)
# Consumida por scripts/hwmap/detect_gpus.py. Documento humano: docs/mapa-compatibilidade-gpu.md (leia §0 para a convencao de evidencia e a secao "Decisoes (D1-D5)").
#
# Evidencia (campo `evidence`): F = fato com fonte (URL em `sources` abaixo, acessado em 2026-10-26);
#   M = medido por nos neste PC (arquivo citado). E = estimativa/hipotese (logica na nota). NUNCA tratar E como F.
#   [M] aparece SO onde ha numero medido neste PC (RX 7800 XT, iGPU Raphael 2 CU, CPU Ryzen 9 7900); todo o resto e [E].
#   IMPORTANTE: TODAS as faixas de device_id abaixo sao E (conferidas de memoria/pci-ids, nao por uma fonte citada aqui),
#   exceto os dois ids medidos neste PC (0x747E RX 7800 XT e 0x164E iGPU Raphael, via Win32_VideoController = M).
#   Quando o device_id nao casar, o nome (name_regex) casa; quando nada casa, a regra `unknown_*` manda fazer micro-benchmark.
#
# Variantes (nomes canonicos; pacotes de reports/export/onnx_export_t0_t1.md):
#   t1-dml-fp16 (~3,0 GB em disco)  | t0-dml-fp16 (~0,96 GB)  | t0-cpu-int4 (~0,39 GB)  | t1-cpu-int8 (~2,6 GB)
#   VRAM de processo (dedicada) depende do comprimento do contexto: ver `context_cap_by_vram` e reports/hwmap/vram_curve.md.
# Regras de campo:
#   gpu_variant: auto_vram -> ver `context_cap_by_vram` e thresholds (D1):
#                  dGPU >= t1_full_min_vram_mb      -> t1-dml-fp16, teto de contexto cheio
#                  t1_capped_min <= VRAM < t1_full  -> t1-dml-fp16 SO com teto de contexto menor e SO se o micro-benchmark aprovar (senao t0-dml-fp16 / CPU)
#                  t0_min <= VRAM < t1_capped_min   -> t0-dml-fp16 com teto proporcional
#                  VRAM < t0_min_vram_mb            -> CPU
#                t0-dml-fp16 / t1-dml-fp16 -> variante fixa (nenhuma regra atual usa; iGPU nao e candidata, D3)
#                cpu -> a GPU e ignorada para autocomplete
#   needs_microbench: true -> a variante GPU so e aceita depois do micro-benchmark de primeira execucao (docs §6); antes disso usa-se `fallback`.
#   supported: true | false | unknown  (false = fora da politica de suporte; unknown = so o micro-benchmark decide)
#   decision_ref: Dn - decisao do usuario (2026-10-26) que fundamenta o campo.
#   microbench_fail_goes_to_cpu: true -> se o micro-benchmark reprovar a variante, vai direto para a CPU (sem tentar T0 DML) - D2 Pascal.
#   candidate_after_measurement: variante a reavaliar SO quando houver medicao real nessa familia (roteiro de homologacao); NAO e candidata hoje.
schema_version: 2
generated: "2026-10-26"
migration:
  from: 1
  to: 2
  date: "2026-10-26"
  decision_ref: "D1-D5"
  changes:
    - "thresholds.t1_min_vram_mb (5900) foi dividido em t1_full_min_vram_mb (8150 MB = placa de 8 GB: T1 com contexto cheio de 2.048) e t1_capped_min_vram_mb (6100: T1 so com teto de contexto menor e micro-benchmark aprovado). Quem lia t1_min_vram_mb deve ler t1_capped_min_vram_mb para o piso absoluto do T1."
    - "NOVO context_cap_by_vram (teto de contexto em tokens totais = prompt+saida, por variante e VRAM minima, calibrado pela curva medida) e context_cap_min_useful_tokens; thresholds.cpu_context_cap_tokens."
    - "NOVO igpu_policy: cpu_always_until_measured (D3). Regras de iGPU sem medicao real (680M/780M/880M/890M/8060S, Arc de Core Ultra, Iris Xe) passam de t0/t1-dml-fp16 + micro-benchmark para cpu; `candidate_variant` foi substituido por `candidate_after_measurement` (informativo)."
    - "Pascal/Polaris: supported unknown + micro-benchmark, SEM variante fp32 (D2); `microbench_fail_goes_to_cpu` no Pascal."
    - "thresholds: cpu_t1_int8 vira opcao declaradamente lenta, escolha do usuario, nunca padrao (D4): cpu_t1_int8_is_default false, cpu_t1_int8_meets_ttft_gate false."
    - "NOVO variants_not_exported (D5) e decisions (D1-D5, status DECIDIDO). Saida do detector (schema 2): context_cap_tokens, context_capped, context_cap_by_variant, igpu_policy, igpus_pending_measurement, adapter_selection; microbench_candidates fica sempre vazio."
  detector: "scripts/hwmap/detect_gpus.py exige schema_version 2 (SCHEMA = 2) e recusa um YAML de schema 1."

decisions:
  D1: {status: DECIDIDO, date: "2026-10-26", title: "VRAM por regime de uso + regra de teto de contexto por VRAM",
       evidence: "[M] reports/hwmap/phase2_measurements.md §E (T0 2,5-2,9 GB / T1 4,8-5,1 GB no regime tipico; 5,4 / 7,6 GB com contexto de 2.048) e reports/hwmap/vram_curve.md (curva 270-2.048 tokens)"}
  D2: {status: DECIDIDO, date: "2026-10-26", title: "Pascal: unknown decidido pelo micro-benchmark; sem variante fp32",
       evidence: "[M] reports/hwmap/phase2_measurements.md §B (builder 0.15.2 nao aceita FP32+DML; remendo MHA = ~9 tok/s); desempenho em Pascal real [E]"}
  D3: {status: DECIDIDO, date: "2026-10-26", title: "iGPUs sempre na CPU nesta versao (igpu_policy: cpu_always_until_measured)",
       evidence: "[M] reports/hwmap/phase2_measurements.md §A (iGPU de 2 CU 13x/26x mais lenta que a 7800 XT e perde para a CPU em todos os casos); iGPUs maiores [E], sem medida"}
  D4: {status: DECIDIDO, date: "2026-10-26", title: "Autocomplete em CPU = sempre T0 int4; T1 int8 so opcao lenta do usuario",
       evidence: "[M] reports/hwmap/phase2_measurements.md §D (T1 int8: 535 ms a 24 thr, 786 ms a 12 thr; gate 500/650 ms nao e cumprido)"}
  D5: {status: DECIDIDO, date: "2026-10-26", title: "Nenhuma variante nova agora; reavaliar com builder/ORT GenAI mais novo",
       evidence: "[M] reports/hwmap/phase2_measurements.md §B (dml-int4 paridade 72%; fp32 invalido no builder); demais opcoes [E]/[F] em docs §5"}

# D3: politica de iGPU. Valor unico reconhecido pelo detector; qualquer outro valor devolve o comportamento por regra (nao usado nesta versao).
igpu_policy: cpu_always_until_measured

# D5: variantes avaliadas e NAO exportadas nesta versao.
variants_not_exported:
  decision_ref: D5
  date: "2026-10-26"
  reevaluate_when: "houver builder / ORT GenAI mais novo (>= 0.16/0.17) que gere FP32+DML valido, respeite device_id ou traga EPs novos"
  items:
    - {id: cuda, reason: "build Cuda da IDE + DLLs NVIDIA; CUDA 13 abandonou Pascal [F S7]", evidence: "E"}
    - {id: tensorrt-rtx, reason: "exige a IDE registrar EPs (Windows ML); RTX 30+; suporte a GenAI nao confirmado [F S3]", evidence: "E"}
    - {id: openvino, reason: "sem maquina Intel de teste; GenAI+OpenVINO nao validado [F S11]", evidence: "E"}
    - {id: migraphx, reason: "'nao suportado para GenAI hoje' [F S3]", evidence: "F"}
    - {id: gguf-llama-cpp, reason: "2o stack (C#<->nativo), contradiz o contrato kapilab-kapi-model-v1 baseado em GenAI", evidence: "E"}
    - {id: t1-dml-int4, reason: "-1,8 p.p. de qualidade no T1 (reports/export/onnx_export_t0_t1.md)", evidence: "M"}
    - {id: t0-dml-int4, reason: "paridade greedy com o HF 72% (prefixo medio 81%) contra 95% do fp16", evidence: "M reports/hwmap/phase2_measurements.md §B"}
    - {id: dml-fp32, reason: "o builder 0.15.2 nao aceita FP32+DML (grafo sem present.*); o remendo MHA decai a ~9 tok/s; sem Pascal local para provar o ganho", evidence: "M builder/remendo; ganho em Pascal E"}

measured_reference:
  gpu: "AMD Radeon RX 7800 XT 16 GB, 624 GB/s (PCI 1002:747E)"
  igpu: "AMD Radeon Graphics 2 CU RDNA2, Ryzen 9 7900 (PCI 1002:164E)"
  evidence: "M reports/export/onnx_export_t0_t1.md §4-§5, reports/export/prefix_cache_ttft.md, reports/hwmap/phase2_measurements.md, reports/hwmap/vram_curve.md; llama.cpp Vulkan 7B Q5_K_M medido pelo usuario (pp 1.395 vs 27 t/s; tg 90 vs 2,5 t/s)"

thresholds:
  # --- VRAM dedicada minima (MB, valor reportado pelo DXGI; uma placa de "8 GB" reporta ~8.176 e de "6 GB" ~6.144) --- decision_ref: D1
  # Os limiares valem para o regime de autocomplete tipico (prompts de ~270-700 tokens); o contexto maior e limitado por context_cap_by_vram.
  t1_full_min_vram_mb: 8150     # [M] T1 dml-fp16 com contexto cheio de 2.048 tokens mediu 7.759 MB (vram_curve.md); 8 GB = 8.176 reportado (RX 6600) => folga de ~417 MB
  t1_capped_min_vram_mb: 6100   # [M+E] piso do T1 = placa de 6 GB (~6.144 reportado): pico 5.708 MB em contexto 1.568 + 400 MB (curva); regime tipico 4,8-5,1 GB (phase2 §E). Entre 6.100 e 8.150 MB: T1 so com teto de contexto menor e micro-benchmark aprovado
  t0_min_vram_mb: 3500          # [M+E] T0 dml-fp16 mediu 2,5-2,9 GB no regime tipico (phase2 §E); margem ~0,5 GB para driver/janela; contexto cheio mediu 5,4 GB
  # --- CPU --- decision_ref: D4
  cpu_context_cap_tokens: 2048      # [F] contexto dos pacotes (genai_config max_length 2048); CPU nao e limitada por VRAM
  cpu_t1_int8_min_physical_cores: 12   # [M fase 2: T1 int8 4/6/8/12/16/20/24 thr = 2224/1452/1133/786/685/608/535 ms de TTFT; 12 thr = 0,79 s, <12 passa de ~1,1 s; threads de Zen4, nao nucleos isolados]
  cpu_t1_int8_min_ram_gb: 16           # [M+E] T1 int8 pico de RAM 3,0 GB + IDE + SO; 16 GB e o piso confortavel
  cpu_t0_min_ram_gb: 8                 # [E] T0 int4 pico 1,53 GB
  cpu_default_variant: t0-cpu-int4     # [M] autocomplete em CPU = SEMPRE T0 int4 (216-313 ms de TTFT); D4
  cpu_optional_variant: t1-cpu-int8    # [M] opcao do usuario, declaradamente lenta, nunca padrao; NAO cumpre o gate de TTFT (535 ms a 24 thr, 786 ms a 12; gate 500/650) - D4
  cpu_t1_int8_is_default: false
  cpu_t1_int8_meets_ttft_gate: false

# D1: TETO DE CONTEXTO por VRAM. Cada linha = [VRAM dedicada minima em MB (DXGI), teto de contexto em tokens TOTAIS (prompt + saida)].
# Calibrado pela curva medida (reports/hwmap/vram_curve.md, RX 7800 XT, pico de VRAM dedicada do processo, n=10 por ponto, MAIOR pico + margem de 400 MB para driver/janela/
# fragmentacao). A curva foi medida com prompt = L tokens e max_length = L+32 (em L=2048: prompt 2.016, max_length 2.048); o teto nominal L e portanto conservador em ~32 tokens.
# [M] = valor da curva medida na 7800 XT; em outras GPUs a VRAM de processo deve ser da mesma ordem [E] (depende do grafo/runtime, nao da potencia) - confirmar na homologacao.
# Abaixo de context_cap_min_useful_tokens a variante nao serve ao autocomplete (envelope tipico de 270-700 tokens + saida): cai para a variante seguinte / CPU.
context_cap_min_useful_tokens: 768
context_cap_by_vram:
  t1-dml-fp16:                # [M] curva T1 (vram_curve.md): pico max por contexto total 302/544/800/1056/1568/2048 = 4.064/4.526/4.654/5.452/5.708/7.759 MB; so >= t1_capped_min_vram_mb
    - [8150, 2048]            # [M] 7.759 MB + 400 MB; uma placa de 8 GB reporta ~8.176 MB (RX 6600/5700, Vega 56): contexto cheio
    - [6100, 1536]            # [M] 5.708 MB + 400 MB (arredondado a 50); uma placa de 6 GB reporta ~6.144 MB: teto 1.536. 1.024 cabe em 5.850 MB mas nao ha placa de ~5,8 GB (piso do T1 = 6 GB, D1)
  t0-dml-fp16:                # [M] curva T0: pico max 1.858/2.337/2.465/3.246/3.510/5.560 MB
    - [5950, 2048]            # [M] 5.560 MB + 400 MB
    - [3900, 1536]            # [M] 3.510 MB + 400 MB (placa de 4 GB reporta ~4.096 MB: teto 1.536)
    - [3650, 1024]            # [M] 3.246 MB + 400 MB
    - [3500, 768]             # piso de VRAM do T0 (D1: 2,5-2,9 GB no regime tipico + ~0,6 GB); a curva so pede 2.850 MB para 768 tokens

# Micro-benchmark de primeira execucao: criterios de aceite (docs §6). Valores [E] ate a fase 2 de medicao.
microbench:
  # Calibrado na fase 2 (reports/hwmap/phase2_measurements.md §C; 10 execucoes/candidato, processo novo por execucao, 270+32 tokens, SEED_TEXT sintetico):
  #   7800 XT  T1 dml-fp16: TTFT p50 170 ms (160-181), 82,7 tok/s (79-86) | T0 dml-fp16: 121 ms (108-127), 131 tok/s (124-138)
  #   CPU 7900 T0 int4 (threads padrao): 231 ms (220-248), 126 tok/s | T1 int8: 755 ms, 32,8 tok/s
  #   iGPU 2 CU: T0 1.347 ms, 21 tok/s | T1 3.488 ms, 8,1 tok/s  => reprovadas por todos os criterios
  # Regra de margem: teto de TTFT ~1,4-2x o pior valor bom medido; piso de tok/s = ~metade do pior valor bom medido. [M] so neste PC (RDNA3/Zen4); outras familias seguem [E].
  # D1: a faixa de VRAM com teto (6.100-8.150 MB) so aceita o T1 se este micro-benchmark aprovar; D2: Pascal/Polaris `unknown` sao decididos por ele (sem fp32).
  prompt_tokens: 270       # [M] mediana do val: 260; media 272
  decode_tokens: 32
  accept_ttft_ms_p50_max: 250      # [M] T0: 7800 XT 121 ms (max 127), folga 2x; era 350 [E]
  accept_ttft_vs_cpu_ratio_max: 0.7   # [M] T0 7800 XT / T0 CPU = 0,52 (121/231); iGPU = 5,8. Baseline = T0 int4 na CPU do mesmo PC
  accept_decode_tok_s_min: 60      # [M] T0: 7800 XT 131 tok/s (min 124); metade; iGPU 21 reprova. Era 25 [E]
  t1_accept_ttft_ms_p50_max: 250   # [M] T1: 7800 XT 170 ms (max 181) => folga 1,4x
  t1_accept_ttft_vs_cpu_ratio_max: 1.0   # [M] novo: T1 GPU contra o baseline T0-CPU: 170/231 = 0,74 (com 0,7 a propria 7800 XT reprovaria o T1); iGPU T1 = 15
  t1_accept_decode_tok_s_min: 40   # [M] T1: 7800 XT 82,7 tok/s (min 79); metade
  budget_seconds: 10               # [M] 7800 XT: T1 5,2 s + baseline T0-CPU 2,9 s = ~8 s (sem Python); iGPU lenta estoura (T0 13 s, T1 33 s): abortar no aquecimento se TTFT > 4x o teto
  abort_warmup_ttft_factor: 4      # [E] proposta (nao medida): aquecimento > 4x teto => reprova sem as 3 repeticoes
  cache_key: "adapter(vendor,device,subsys,revision)+driver_version+genai_version+package_hash+windows_build"

sources:
  S1: {url: "https://learn.microsoft.com/en-us/windows/ai/directml/dml-intro", accessed: "2026-10-26", fact: "DirectML esta em 'sustained engineering'; suportado por todo hardware DX12; introduzido no Windows 10 1903"}
  S2: {url: "https://onnxruntime.ai/docs/execution-providers/DirectML-ExecutionProvider.html", accessed: "2026-10-26", fact: "Requisito: GPU DX12 - NVIDIA Kepler (GTX 600)+, AMD GCN 1a ger. (HD 7000)+, Intel Haswell HD+, Qualcomm Adreno 600+; device_id = ordem de IDXGIFactory::EnumAdapters"}
  S3: {url: "https://learn.microsoft.com/en-us/windows/ai/new-windows-ml/supported-execution-providers", accessed: "2026-10-26", fact: "Windows ML inclui CPU e DirectML (legacy); sob demanda (Win11 24H2/26100+): MIGraphX (AMD RDNA3+, 'nao suportado para GenAI hoje'), NvTensorRtRtx (RTX 30xx+, driver >= 32.0.15.5585, CUDA 12.5), OpenVINO, QNN, VitisAI, WebGPU (experimental, DX12; ~Intel 11a ger./NVIDIA Turing+)"}
  S4: {url: "https://learn.microsoft.com/en-us/windows/ai/new-windows-ml/run-genai-onnx-models", accessed: "2026-10-26", fact: "ORT GenAI para Windows ML e 0.x preview, sujeito a mudancas"}
  S5: {url: "https://docs.nvidia.com/cuda/pascal-tuning-guide/index.html", accessed: "2026-10-26", fact: "GP100: FP16 2x FP32; GP104 (e familia GP10x de consumo): FP16 a 1/64 do FP32; GP104 tem INT8 dp4a (__dp4a)"}
  S6: {url: "https://www.anandtech.com/show/10325/the-nvidia-geforce-gtx-1080-and-1070-founders-edition-review/5", accessed: "2026-10-26", fact: "FP16 no GP104 'bom para compatibilidade e pouco mais'"}
  S7: {url: "https://docs.nvidia.com/cuda/cuda-features-archive/index.html", accessed: "2026-10-26", fact: "CUDA 13.0 removeu compilacao offline/bibliotecas para Maxwell, Pascal e Volta (CC < 7.5); CUDA 12.x ainda compila"}
  S8: {url: "https://guru3d.com/story/nvidia-releases-geforce-58266-security-driver-for-maxwell-and-pascal-gpus/", accessed: "2026-10-26", fact: "Maxwell/Pascal/Volta em driver R580 'security-only' (relato de imprensa; confirmar no site da NVIDIA)"}
  S9: {url: "https://www.pcgameshardware.de/Grafikkarten-Grafikkarte-97980/News/AMD-Radeon-Adrenalin-Edition-26-5-2-Polaris-Vega-Treiber-1536146/", accessed: "2026-10-26", fact: "Polaris e Vega estao em driver 'legacy' separado desde 2023, com atualizacoes raras (relato de imprensa)"}
  S10: {url: "https://sisoftware.co.uk/?p=2108", accessed: "2026-10-26", fact: "Navi 10 (RX 5700 XT) reporta FP16/half a 2x do FP32 (benchmark GPGPU)"}
  S11: {url: "https://www.intel.com/content/www/us/en/developer/articles/guide/windows-ml-support.html", accessed: "2026-10-26", fact: "Intel + Windows ML: CPU Tiger Lake+, iGPU Alder Lake (12a ger.)+, NPU Core Ultra, Arc dedicada A310+ (8 GB recomendado) e B580+ (10 GB recomendado); nao menciona Iris Xe/UHD por nome"}

# Ordem importa: a PRIMEIRA regra cujo vendor casar E (device_id em alguma faixa OU name_regex casar) vence.
# Mais especificas antes das genericas. Cada regra de dgpu usa os thresholds acima.
rules:
  # =============================== software / sem DX12 ===============================
  - id: software-basic-render
    vendor_id: 0x1414
    family: "Microsoft Basic Render Driver / WARP"
    kind: software
    match: {name_regex: "Basic Render|WARP|Microsoft"}
    supported: false
    gpu_variant: cpu
    fallback: t0-cpu-int4
    confidence: alta
    evidence: ["F S1: DirectML exige hardware DX12; adaptador de software e CPU emulada"]
    notes: "Ignorar sempre. Sem driver de GPU instalado."

  # =============================== NVIDIA (0x10DE) ===============================
  - id: nv-pre-pascal
    vendor_id: 0x10DE
    family: "NVIDIA pre-GTX 1000 (Fermi/Kepler/Maxwell: GTX 400-900, GT 7xx, GTX 750)"
    kind: dgpu
    match: {device_id_ranges: [[0x0640, 0x13FF], [0x1400, 0x17FF]], name_regex: "GTX (4[0-9]{2}|5[0-9]{2}|6[0-9]{2}|7[0-9]{2}|9[0-9]{2})\\b|GT (6|7|9)[0-9]{2}"}
    supported: false
    dx12: "Kepler+ roda DML (F S2) mas sem FP16 acelerado; Maxwell 'security-only' (F S8)"
    fp16: {native: "no", note: "FP16 sem ganho (Maxwell)"}
    int8: {dp4a: false, matrix: none}
    gpu_variant: cpu
    fallback: t0-cpu-int4
    confidence: media
    evidence: ["E politica: abaixo da fronteira GTX 1000 definida pelo produto", "F S2 (DML roda em Kepler+)", "F S8"]
    notes: "Fora da politica de suporte. Usuario avancado pode forcar via override (--force-gpu) por conta propria."

  - id: nv-pascal
    vendor_id: 0x10DE
    family: "NVIDIA GTX 10 (Pascal GP10x) + MX150/MX250 + GT 1030"
    kind: dgpu
    match: {device_id_ranges: [[0x1B00, 0x1D8F]], name_regex: "GTX 10[0-9]{2}|GT 1030|GTX TITAN X|TITAN Xp|MX1[5-9]0|MX2[0-9]0|P[0-9]{3,4}\\b"}
    supported: unknown
    dx12: "FL 12_1"
    fp16: {native: "limited", rate: "1/64 do FP32 nas GP10x de consumo (F S5, S6)"}
    int8: {dp4a: true, matrix: none, note: "dp4a existe (F S5) mas o DML nao necessariamente o usa [E]"}
    gpu_variant: auto_vram
    needs_microbench: true
    microbench_fail_goes_to_cpu: true
    decision_ref: D2
    fallback: t0-cpu-int4
    confidence: baixa
    evidence: ["F S5 FP16 1/64", "E o DML pode converter FP16 para FP32 em shader (aceitavel) OU executar FP16 lento (prefill de 270 tok seria de segundos): sem medida em Pascal real", "M D2 (2026-10-26): SEM variante fp32 - o builder 0.15.2 nao aceita FP32+DML (grafo invalido) e o remendo MHA decai a ~9 tok/s na 7800 XT (reports/hwmap/phase2_measurements.md §B)", "PENDENTE homologacao: dml-fp16 T0/T1 em Pascal real (roteiro)"]
    notes: "D2: `unknown` decidido pelo micro-benchmark; reprovou => CPU T0 int4 (sem tentar T0 DML). Maior risco do mapa: T1 fp16 prefill = ~0,8 TFLOP; se o FP16 correr a 1/64 (~70 GFLOPS na GTX 1060) leva >10 s. Nunca aceitar sem micro-benchmark. VRAM de 6 GB cai na faixa com teto (D1): T1 so com teto de contexto menor."

  - id: nv-turing-gtx16
    vendor_id: 0x10DE
    family: "NVIDIA GTX 16 (Turing TU116/TU117, sem Tensor Cores)"
    kind: dgpu
    match: {device_id_ranges: [[0x1F82, 0x1F82], [0x1F91, 0x1F9F], [0x1FA0, 0x1FFF], [0x2182, 0x21FF]], name_regex: "GTX 16[0-9]{2}"}
    supported: true
    dx12: "FL 12_1"
    fp16: {native: "yes", rate: "2x FP32 (shaders FP16 dedicados) [E]"}
    int8: {dp4a: true, matrix: none}
    gpu_variant: auto_vram
    decision_ref: D1
    fallback: t0-cpu-int4
    confidence: media
    evidence: ["E: Turing tem FP16 de taxa dupla; sem Tensor Cores nos TU116/117", "E banda 112-288 GB/s (1650 GDDR5 128 GB/s; 1660 Super 336 GB/s)"]
    notes: "D1: GTX 1650 de 4 GB => T0 dml-fp16 com teto de contexto proporcional (VRAM < t1_capped_min). GTX 1660/Super/Ti de 6 GB => faixa com teto: T1 so com teto de contexto menor e micro-benchmark aprovado, senao T0."

  - id: nv-turing-rtx20
    vendor_id: 0x10DE
    family: "NVIDIA RTX 20 (Turing TU10x, Tensor Cores gen 2)"
